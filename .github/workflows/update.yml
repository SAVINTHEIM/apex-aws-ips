name: Update Apex AWS IP Lists

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download AWS IP ranges
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 3 \
            https://ip-ranges.amazonaws.com/ip-ranges.json \
            -o aws-ip-ranges.json

          jq -e '.prefixes | type == "array"' aws-ip-ranges.json >/dev/null

      - name: Update apex-eu.txt
        shell: bash
        run: |
          set -euo pipefail

          jq -r '
            .prefixes[]
            | select(
                .service == "EC2" and
                .region == "eu-central-1"
              )
            | .ip_prefix
          ' aws-ip-ranges.json | sort -u > apex-eu.txt

          test -s apex-eu.txt

      - name: Update apex-eu1.txt
        shell: bash
        run: |
          set -euo pipefail

          jq -r '
            .prefixes[]
            | select(
                .service == "EC2" and
                (
                  .region == "eu-central-1" or
                  .region == "eu-west-1" or
                  .region == "eu-west-2" or
                  .region == "eu-west-3" or
                  .region == "eu-north-1" or
                  .region == "eu-south-1" or
                  .region == "eu-south-2" or
                  .region == "eu-central-2"
                )
              )
            | .ip_prefix
          ' aws-ip-ranges.json | sort -u > apex-eu1.txt

          test -s apex-eu1.txt

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update European AWS IP lists"
          file_pattern: apex-eu.txt apex-eu1.txt
