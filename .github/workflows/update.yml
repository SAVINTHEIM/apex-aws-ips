
name: Update Apex AWS IP Lists

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download AWS IP ranges
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 3 \
            https://ip-ranges.amazonaws.com/ip-ranges.json \
            -o aws-ip-ranges.json

          jq -e '
            (.syncToken | type == "string") and
            (.createDate | type == "string") and
            (.prefixes | type == "array") and
            (.prefixes | length > 0)
          ' aws-ip-ranges.json >/dev/null

          echo "AWS syncToken: $(jq -r '.syncToken' aws-ip-ranges.json)"
          echo "AWS createDate: $(jq -r '.createDate' aws-ip-ranges.json)"

      - name: Update apex-eu.txt
        shell: bash
        run: |
          set -euo pipefail

          jq -r '
            .prefixes[]
            | select(
                .service == "EC2" and
                .region == "eu-central-1"
              )
            | .ip_prefix
          ' aws-ip-ranges.json | LC_ALL=C sort -u > apex-eu.txt

          test -s apex-eu.txt

          echo "Frankfurt IP ranges: $(wc -l < apex-eu.txt)"

      - name: Update apex-eu1.txt
        shell: bash
        run: |
          set -euo pipefail

          jq -r '
            .prefixes[]
            | select(
                .service == "EC2" and
                (.region | startswith("eu-"))
              )
            | .ip_prefix
          ' aws-ip-ranges.json | LC_ALL=C sort -u > apex-eu1.txt

          test -s apex-eu1.txt

          echo "European IP ranges: $(wc -l < apex-eu1.txt)"

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update European AWS IP lists"
          file_pattern: apex-eu.txt apex-eu1.txt
